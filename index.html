<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chris Reyes' Links</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  
  <style>
    html {
      min-height: 100%;
    }

    body {
      min-height: 100%;
      padding-top: 40px;
      padding-bottom: 40px;
      background: linear-gradient(
        180deg,#001f5c,#66d9ff,#ffffff, #ffd6ec,#ff69b4);
      color: rgba(255, 255, 255, 1.0);
      font-family: "Open Sans";
    }

    .avatar-image {
      width: 128px;
      height: 128px;
      object-fit: cover;
      border-radius: 128px;
    }

    .thumbnail {
      width: 48px;
      height: 48px;
      border-radius: 48px;
      object-fit: cover;
    }

    a {
      color: rgba(250, 255, 255, 1.0);
      text-decoration: none;
    }

    .item {
      background-color: rgba(90, 103, 170, 0.6);
      border-radius: 200px;
      padding: 5px;
      padding-right: 53px;
      box-shadow: 2px 2px 10px 0px rgba(122,32,122,0.25);
    }

    .main-container {
      max-width: 640px;
      margin: auto;
    }

    .image-row {
      margin-bottom: 20px;
      text-align: center;
    }

    .name-row {
      margin-bottom: 30px;
      text-align: center;
      font-family: "Inter";
      font-size: 24px;
      font-weight: 900;
    }

    .social-icons-row {
      margin-bottom: 30px;
      display: flex;
      justify-content: space-around;
    }

    .item {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }

    .link-text {
      text-align: center;
      flex-grow: 1;
    }

  </style>
</head>

<body>
  <div class="main-container">
    <div class="image-row">
      <img class="avatar-image" src="/thumbnails/profile-pic.jpg" alt="A dog with sunglasses smiling at the camera">
    </div>

    <div class="name-row">
      Christopher Reyes
    </div>

    <div class="social-icons-row">
      <a href="https://github.com/TheCoolestChris"  target="_blank">
         <i class="fa-brands fa-github"></i>
      </a>

      <!-- I only have Github. -->

    </div>

    <div class="links-row">
      <div class="item">
        <img class="thumbnail" src="/thumbnails/video-games.jpg" alt="Someone creating a business blueprint">

        <a class="link-text" target="_blank" href="https://en.wikipedia.org/wiki/List_of_video_games_considered_the_best">
          Top Games Selling Games in Every Year
        </a>
      </div>

      <div class="item">
        <img class="thumbnail" src="/thumbnails/chicago-bean.jpg" alt="A photo of letter blocks">

        <a class="link-text" target="_blank" href="https://www.chicago.gov/city/en/depts/dca/supp_info/chicago_s_publicartcloudgateinmillenniumpark.html">
          Chicago Bean
        </a>
      </div>

      <div class="item">
        <img class="thumbnail" src="/thumbnails/html.jpg" alt="A notebook with a written checklist">

        <a class="link-text" target="_blank" href="https://www.washington.edu/accesscomputing/webd2/student/unit1/module3/html_history.html">
          HTML's History
        </a>
      </div>

    </div> 
  </div> 
  </body>
</html>
